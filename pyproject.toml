[project]
name = "vichara"
version = "0.0.1"
description = "A reasoning language model built from scratch, for learning and research"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy", "regex"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
